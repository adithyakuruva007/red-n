name: Build Red-N APK & Multiplatform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Multiplatform Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Optimized Android Release APK
        run: ./gradlew :androidApp:assembleFossRelease --stacktrace

      - name: Verify Kotlin Desktop Compilation
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-n-apk
          path: androidApp/build/outputs/apk/foss/release/*.apk
